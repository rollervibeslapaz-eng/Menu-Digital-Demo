<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Demo</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header con logo y nombre -->
    <header class="header">
        <div class="logo">🍔</div>
        <h1 class="restaurant-name">La Estación Burger</h1>
        <p class="tagline">Las mejores hamburguesas de la ciudad</p>
    </header>

    <!-- Navegación de categorías -->
    <nav class="categories-nav">
        <button class="category-btn active" data-category="todos">Todos</button>
        <button class="category-btn" data-category="hamburguesas">Hamburguesas</button>
        <button class="category-btn" data-category="snacks">Snacks</button>
        <button class="category-btn" data-category="bebidas">Bebidas</button>
    </nav>

    <!-- Grid de platillos (se llena con JavaScript) -->
    <main class="menu-container">
        <div id="menu-grid" class="menu-grid"></div>
    </main>

    <!-- Botón flotante de WhatsApp -->
    <a href="https://wa.me/5215512345678?text=Hola,%20quiero%20hacer%20un%20pedido" 
       class="whatsapp-float" 
       target="_blank">
        💬 Pedir por WhatsApp
    </a>

    <!-- Footer -->
    <footer class="footer">
        <p>📍 Av. Principal #123, Ciudad</p>
        <p>🕐 Lun-Dom: 12:00 - 22:00</p>
        <p> 55 1234 5678</p>
    </footer>

    <script src="data.js"></script>
</body>
</html>
